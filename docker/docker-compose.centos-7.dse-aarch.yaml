version: "3"

services:

  cross-compile-aarch64-runtime-setup:
    image: netty:cross_compile_aarch64
    build:
      context: ../
      dockerfile: docker/Dockerfile.cross_compile_aarch64
      args:
        gcc_version: "10.2-2020.11"
        java_version: "8.0.372-zulu"

  cross-compile-aarch64-common: &cross-compile-aarch64-common
    depends_on: [ cross-compile-aarch64-runtime-setup ]
    image: netty:cross_compile_aarch64
    environment:
      - GPG_KEYNAME
      - GPG_PASSPHRASE
      - GPG_PRIVATE_KEY
      - MAVEN_OPTS
    volumes:
      - ~/.ssh:/root/.ssh
      - ~/.gnupg:/root/.gnupg
      - ~/.m2:/root/.m2
      - ..:/code
    working_dir: /code

  cross-compile-aarch64-build-and-publish:
    <<: *cross-compile-aarch64-common
    command: /bin/bash -cl "./mvnw -U -B -ntp -Plinux-aarch64 -am clean deploy -pl !microbench,!testsuite-native,!testsuite-shading -DskipTests=true -DaltDeploymentRepository=\"artifactory::default::https://repo.datastax.com/artifactory/datastax-releases-local\""