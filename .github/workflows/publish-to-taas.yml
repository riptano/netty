name: Publish DataStax Netty to IBM TaaS Artifactory

# ---------------------------------------------------------------------------
# Publishes our internal Netty fork to IBM TaaS Artifactory.
#
# Modes:
#   release   version: <upstream>.<N>.dse        e.g. 4.1.137.2.dse
#             N is auto-incremented by querying what is already in TaaS.
#   snapshot  version: <upstream>-<sha>-SNAPSHOT  e.g. 4.1.137-a3f5b2c-SNAPSHOT
#             Each commit produces a distinct snapshot. No git tag, no pom commit.
#
# Required GitHub secrets (already set on riptano/netty):
#   TAAS_USERNAME   datastax-enterprise-automation@ibm.com
#   TAAS_PASSWORD   identity token from 1Password → DSE-Shared →
#                   "IBM TaaS JFrog: datastax-enterprise-automation Identity Token"
#
# No SSH deploy key needed. The release git push (version-bump commit + tag)
# uses the workflow's built-in GITHUB_TOKEN with contents:write permission.
#
# No Jenkins macOS instances needed. macOS builds use free GitHub-hosted runners.
# ---------------------------------------------------------------------------

on:
  # Manual trigger only. The push trigger below exists solely so that GitHub
  # registers this workflow in the Actions UI and API — it matches a branch
  # pattern that will never exist, so it never auto-fires.
  push:
    branches:
      - 'workflow-registration-only'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and publish from'
        required: true
        default: 'dse-netty-4.1.137.2.dse'
      mode:
        description: 'Publish mode'
        required: true
        type: choice
        options:
          - release
          - snapshot

permissions:
  contents: write   # push version-bump commit + tag back to branch on release
  packages: read

env:
  MAVEN_OPTS: >-
    -Dhttp.keepAlive=false
    -Dmaven.wagon.http.pool=false
    -Dmaven.wagon.http.retryhandler.count=5
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=240
  TAAS_API_URL:  https://na.artifactory.swg-devops.com/artifactory
  TAAS_REPO:     datastax-team-dse-external-libs-maven-local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 0 — Validate credentials, compute version, expose it to all jobs.
  # This is the only job that talks to TaaS before we commit to a long build.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    outputs:
      version:    ${{ steps.compute.outputs.version }}
      deploy_url: ${{ steps.compute.outputs.deploy_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Compute version and deploy URL
        id: compute
        env:
          TAAS_USERNAME: ${{ secrets.TAAS_USERNAME }}
          TAAS_PASSWORD: ${{ secrets.TAAS_PASSWORD }}
          TAAS_API_URL:  ${{ env.TAAS_API_URL }}
          TAAS_REPO:     ${{ env.TAAS_REPO }}
        run: |
          set -euo pipefail
          POM_VERSION=$(./mvnw -B -q help:evaluate \
            -Dexpression=project.version -DforceStdout 2>/dev/null)
          echo "pom version: $POM_VERSION"

          bash .github/scripts/compute_taas_version.sh \
            "${{ inputs.mode }}" "$POM_VERSION"

          # Also resolve and export the deploy URL so publish job doesn't
          # repeat the logic.
          echo "deploy_url=${{ env.TAAS_API_URL }}/${{ env.TAAS_REPO }}" \
            >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Stage 1 — Full Linux x86_64 build inside CentOS 6 Docker image.
  #            Produces every non-native-only JAR plus linux-x86_64 natives.
  # ---------------------------------------------------------------------------
  build-linux-x64:
    runs-on: ubuntu-latest
    needs: validate
    name: Build Linux x86_64 (Full)
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Cache local Maven repository
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-linux-x64-${{ hashFiles('**/pom.xml') }}
          restore-keys: cache-maven-linux-x64-

      - name: Create local staging directory
        run: mkdir -p ~/local-staging

      - name: Build Docker image (CentOS 6 for glibc compatibility)
        run: docker build -f docker/Dockerfile-netty-centos6 -t netty-centos6 .

      - name: Build and stage all artifacts
        run: |
          docker run -t \
            -v ~/.m2:/root/.m2:Z \
            -v ~/local-staging:/root/local-staging:Z \
            -v $(pwd):/code:Z \
            -w /code \
            --entrypoint="" \
            netty-centos6 \
            bash -ic "
              set -euo pipefail
              ./mvnw -B versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false
              ./mvnw -B clean install -DskipTests=true
              ./mvnw -B deploy \
                -DaltDeploymentRepository=local-staging::default::file:///root/local-staging \
                -DskipTests=true
            "

      - name: Upload local staging directory
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-local-staging
          path: ~/local-staging
          if-no-files-found: error
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # Stage 2 — Linux aarch64 native libraries (epoll, unix-common)
  # ---------------------------------------------------------------------------
  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    needs: validate
    name: Build Linux aarch64 (Native Libraries)
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-linux-aarch64-${{ hashFiles('**/pom.xml') }}
          restore-keys: cache-maven-linux-aarch64-

      - name: Install native build toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y autoconf automake libtool make gcc libaio-dev

      - name: Create local staging directory
        run: mkdir -p ~/local-staging

      - name: Set version and stage Linux aarch64 native libraries
        run: |
          ./mvnw -B versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false
          ./mvnw -B \
            -pl transport-native-unix-common,transport-native-epoll \
            -am deploy \
            -DskipTests=true \
            -DaltDeploymentRepository=local-staging::default::file:///$(pwd)/local-staging

      - name: Upload local staging directory
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-local-staging
          path: ${{ github.workspace }}/local-staging
          if-no-files-found: error
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # Stage 3 — macOS Intel x86_64 native libraries (kqueue, resolver-dns-macos)
  #            Free GitHub-hosted runner — no Jenkins macOS instance needed.
  # ---------------------------------------------------------------------------
  build-macos-intel:
    runs-on: macos-15-intel
    needs: validate
    name: Build macOS x86_64 (Native Libraries)
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-macos-intel-${{ hashFiles('**/pom.xml') }}
          restore-keys: cache-maven-macos-intel-

      - name: Install tools via Brewfile
        run: brew bundle
        continue-on-error: true

      - name: Create local staging directory
        run: mkdir -p ~/local-staging

      - name: Set version and stage macOS Intel native libraries
        run: |
          ./mvnw -B versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false
          ./mvnw -B -U \
            -pl resolver-dns-native-macos,transport-native-unix-common,transport-native-kqueue \
            deploy \
            -DskipTests \
            -DaltDeploymentRepository=local-staging::default::file:///$(pwd)/local-staging

      - name: Upload local staging directory
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-local-staging
          path: ${{ github.workspace }}/local-staging
          if-no-files-found: error
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # Stage 4 — macOS ARM aarch64 (Apple Silicon) native libraries
  #            Free GitHub-hosted runner — no Jenkins macOS instance needed.
  # ---------------------------------------------------------------------------
  build-macos-arm:
    runs-on: macos-15
    needs: validate
    name: Build macOS aarch64 (Native Libraries)
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-macos-arm-${{ hashFiles('**/pom.xml') }}
          restore-keys: cache-maven-macos-arm-

      - name: Install tools via Brewfile
        run: brew bundle
        continue-on-error: true

      - name: Create local staging directory
        run: mkdir -p ~/local-staging

      - name: Set version and stage macOS ARM native libraries
        run: |
          ./mvnw -B versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false
          ./mvnw -B -Pmac-m1-cross-compile \
            -pl resolver-dns-native-macos,transport-native-unix-common,transport-native-kqueue \
            deploy \
            -DskipTests \
            -DaltDeploymentRepository=local-staging::default::file:///$(pwd)/local-staging

      - name: Upload local staging directory
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-local-staging
          path: ${{ github.workspace }}/local-staging
          if-no-files-found: error
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # Stage 5 — Merge all platform staging dirs, build netty-all, publish to
  #            IBM TaaS Artifactory.
  #            For release builds: commit version bump + push git tag.
  # ---------------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: [validate, build-linux-x64, build-linux-aarch64, build-macos-intel, build-macos-arm]
    name: Merge and Publish to IBM TaaS Artifactory
    env:
      VERSION:    ${{ needs.validate.outputs.version }}
      DEPLOY_URL: ${{ needs.validate.outputs.deploy_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0          # full history so we can push commit + tag
          persist-credentials: true  # keep GITHUB_TOKEN remote for git push

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-publish-${{ hashFiles('**/pom.xml') }}
          restore-keys: cache-maven-publish-

      # Write TaaS credentials into ~/.m2/settings.xml so that
      # deploy_maven_packages.sh → mvn deploy:deploy-file can authenticate.
      # The server id "taas" matches -DrepositoryId=taas in the script call.
      - name: Configure Maven settings for IBM TaaS
        uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [{
              "id": "taas",
              "username": "${{ secrets.TAAS_USERNAME }}",
              "password": "${{ secrets.TAAS_PASSWORD }}"
            }]

      # ---- Download all per-platform staging directories -------------------
      - name: Download Linux x86_64 staging
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-local-staging
          path: ~/linux-x86_64-local-staging

      - name: Download Linux aarch64 staging
        uses: actions/download-artifact@v4
        with:
          name: linux-aarch64-local-staging
          path: ~/linux-aarch64-local-staging

      - name: Download macOS x86_64 staging
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-local-staging
          path: ~/macos-x86_64-local-staging

      - name: Download macOS aarch64 staging
        uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-local-staging
          path: ~/macos-aarch64-local-staging

      # Install all platform artifacts into the local Maven repo so that the
      # netty-all aggregation step can resolve them.
      - name: Install platform artifacts to local Maven repository
        run: |
          bash .github/scripts/local_staging_install_release.sh \
            ~/.m2/repository \
            ~/linux-x86_64-local-staging \
            ~/linux-aarch64-local-staging \
            ~/macos-x86_64-local-staging \
            ~/macos-aarch64-local-staging

      # netty-all is an aggregation JAR that includes every other module.
      # It must be built last, after all platform artifacts are in the local repo.
      - name: Set version and build netty-all
        run: |
          ./mvnw -B versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false
          ./mvnw -B --file pom.xml -pl all clean install -DskipTests=true

      # Merge all platform staging dirs into one tree, then add netty-all.
      - name: Merge staging repositories
        run: |
          bash .github/scripts/local_staging_install_release.sh \
            ~/local-staging \
            ~/linux-x86_64-local-staging \
            ~/linux-aarch64-local-staging \
            ~/macos-x86_64-local-staging \
            ~/macos-aarch64-local-staging

          if [ -d "$HOME/.m2/repository/io/netty/netty-all" ]; then
            cp -r "$HOME/.m2/repository/io/netty/netty-all" \
                  "$HOME/local-staging/io/netty/"
          fi

      # Deploy every artifact in the merged staging dir to TaaS Artifactory.
      # deploy_maven_packages.sh tolerates individual failures (warns and
      # continues) so a single re-upload of an existing artifact doesn't abort
      # the whole publish.
      - name: Deploy to IBM TaaS Artifactory
        run: |
          bash .github/scripts/deploy_maven_packages.sh \
            ~/local-staging \
            ${{ env.DEPLOY_URL }} \
            taas

      # -----------------------------------------------------------------------
      # Release only: commit the version-bumped pom.xml files back to the
      # branch and push a git tag. Uses GITHUB_TOKEN (contents:write).
      # Not needed for snapshots — each snapshot is identified by its SHA,
      # no pom.xml changes and no tagging.
      # -----------------------------------------------------------------------
      - name: Commit version bump and push tag
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "DataStax Engineering"
          git config user.email "dseng@datastax.com"

          git add $(git diff --name-only --diff-filter=M | grep pom.xml || true)
          git commit -m "Set version to ${{ env.VERSION }}"
          git tag "${{ env.VERSION }}" -m "Release ${{ env.VERSION }}"

          git push origin HEAD:${{ inputs.branch }}
          git push origin "${{ env.VERSION }}"

      # Always upload the merged staging dir so engineers can inspect or
      # use it locally (e.g. with extraRepositoriesConfig in BDP) even if
      # the deploy step partially failed.
      - name: Upload merged staging directory (debug / local testing)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merged-local-staging
          path: ~/local-staging
          if-no-files-found: warn
          include-hidden-files: true
