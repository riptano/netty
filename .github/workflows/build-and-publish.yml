name: Build and Publish DataStax Netty to GitHub Packages and IBM TaaS

# ---------------------------------------------------------------------------
# Always publishes to GitHub Packages. Publishing to IBM TaaS Artifactory is
# opt-in and only available on a manual run (workflow_dispatch) through the
# `taas_publish` input. The version comes from pom.xml (which never contains
# -SNAPSHOT):
#   taas_publish = none      nothing is changed, GitHub Packages only (default)
#   taas_publish = snapshot  -SNAPSHOT is appended to the pom version
#                            -> datastax-team-nosql-snapshots-maven-local
#   taas_publish = release   the pom version is used as is
#                            -> datastax-team-nosql-releases-maven-local
# To publish a different version, change it in pom.xml first.
#
# Required GitHub secrets: TAAS_USERNAME, TAAS_PASSWORD
# (1Password -> DSE-Shared -> "IBM TaaS JFrog: datastax-enterprise-automation
# Identity Token").
# ---------------------------------------------------------------------------

on:
  # Allows manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      taas_publish:
        description: 'Also publish to IBM TaaS Artifactory (snapshot appends -SNAPSHOT to the pom version)'
        required: true
        type: choice
        options:
          - none
          - snapshot
          - release
        default: none

  # Trigger on version tags
  push:
    branches:
      - dse-netty-4.1.137.1.dse
    tags:
      - '*.dse'
      - 'dse-netty-*'

permissions:
  contents: read
  packages: write

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240
  TAAS_API_URL:        https://na.artifactory.swg-devops.com/artifactory
  TAAS_RELEASES_REPO:  datastax-team-nosql-releases-maven-local
  TAAS_SNAPSHOTS_REPO: datastax-team-nosql-snapshots-maven-local

# Cancel running jobs when a new push happens to the same branch/tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 0: Work out the version to build and where to publish it.
  # The pom version is used as is, except that taas_publish=snapshot appends
  # -SNAPSHOT. Every build job below applies it with versions:set.
  prepare:
    runs-on: ubuntu-latest
    name: Resolve version
    outputs:
      snapshot: ${{ steps.v.outputs.snapshot }}
      version: ${{ steps.v.outputs.version }}
      taas_url: ${{ steps.v.outputs.taas_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Read pom version
        id: v
        env:
          TAAS_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.taas_publish || 'none' }}
        run: |
          set -euo pipefail
          VERSION=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null)
          echo "pom version: $VERSION, taas_publish: $TAAS_PUBLISH"
          SNAPSHOT=false
          TAAS_REPO="${TAAS_RELEASES_REPO}"
          if [ "$TAAS_PUBLISH" = "snapshot" ]; then
            SNAPSHOT=true
            VERSION="${VERSION}-SNAPSHOT"
            TAAS_REPO="${TAAS_SNAPSHOTS_REPO}"
          fi
          echo "version to build: $VERSION"
          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "taas_url=${TAAS_API_URL}/${TAAS_REPO}" >> "$GITHUB_OUTPUT"

  # Stage 1: Build full Netty library on Linux x64
  build-linux-x64:
    runs-on: ubuntu-latest
    name: Build Linux x86_64 (Full)
    needs: [prepare]

    steps:
      - uses: actions/checkout@v4

      # The build itself runs in Docker; this JDK is only for versions:set.
      - name: Set up JDK 8 (SNAPSHOT version only)
        if: needs.prepare.outputs.snapshot == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Set SNAPSHOT version
        if: needs.prepare.outputs.snapshot == 'true'
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.prepare.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true

      # Cache .m2/repository
      - name: Cache local Maven repository
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-${{ hashFiles('**/pom.xml') }}
            cache-maven-

      - name: Configure Maven settings for Docker
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create local staging directory
        run: mkdir -p ~/local-staging

      - name: Build docker image
        run: docker build -f docker/Dockerfile-netty-centos6 -t netty-centos6 .

      - name: Build and stage artifacts
        run: |
          docker run -t \
            -v ~/.m2:/root/.m2:Z \
            -v ~/local-staging:/root/local-staging:Z \
            -v $(pwd):/code:Z \
            -w /code \
            --entrypoint="" \
            netty-centos6 \
            bash -ic "./mvnw -B clean install -DskipTests=true ; ./mvnw -B deploy -DaltDeploymentRepository=local-staging::default::file:///root/local-staging -DskipTests=true"

      - name: Upload local staging directory
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-local-staging
          path: ~/local-staging
          if-no-files-found: error
          include-hidden-files: true

  # Stage 2: Build Linux aarch64 native libraries on a native ARM64 runner
  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    name: Build Linux aarch64 (Native Libraries)
    needs: [prepare, build-linux-x64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Set SNAPSHOT version
        if: needs.prepare.outputs.snapshot == 'true'
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.prepare.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true

      # Cache .m2/repository
      - name: Cache local Maven repository
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-linux-aarch64-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-linux-aarch64-${{ hashFiles('**/pom.xml') }}
            cache-maven-

      - name: Install native build toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y autoconf automake libtool make gcc libaio-dev

      - name: Create local staging directory
        run: mkdir -p ~/local-staging

      - name: Build and stage Linux aarch64 native libraries
        run: |
          ./mvnw -B \
            -pl transport-native-unix-common,transport-native-epoll \
            -am deploy \
            -DskipTests=true \
            -DaltDeploymentRepository=local-staging::default::file://$(pwd)/local-staging

      - name: Upload local staging directory
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-local-staging
          path: ${{ github.workspace }}/local-staging
          if-no-files-found: error
          include-hidden-files: true

  # Stage 3: Build macOS Intel x86_64 native libraries
  build-macos-intel:
    runs-on: macos-15-intel
    name: Build macOS x86_64 (Native Libraries)
    needs: [prepare, build-linux-x64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Set SNAPSHOT version
        if: needs.prepare.outputs.snapshot == 'true'
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.prepare.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true

      # Cache .m2/repository
      - name: Cache local Maven repository
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-macos-intel-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-macos-intel-${{ hashFiles('**/pom.xml') }}
            cache-maven-

      - name: Install tools via brew
        run: brew bundle
        continue-on-error: true

      - name: Create local staging directory
        run: mkdir -p ~/local-staging

      - name: Build and stage native libraries
        run: |
          echo "$(pwd)"
          ./mvnw -B -U \
            -pl resolver-dns-native-macos,transport-native-unix-common,transport-native-kqueue \
            deploy \
            -DskipTests \
            -DaltDeploymentRepository=local-staging::default::file:///$(pwd)/local-staging
          find $(pwd)/local-staging
          find ~/local-staging

      - name: Upload local staging directory
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-local-staging
          path: ${{ github.workspace }}/local-staging
          if-no-files-found: error
          include-hidden-files: true

  # Stage 4: Build macOS ARM aarch64 native libraries
  build-macos-arm:
    runs-on: macos-15
    name: Build macOS aarch64 (Native Libraries)
    needs: [prepare, build-linux-x64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Set SNAPSHOT version
        if: needs.prepare.outputs.snapshot == 'true'
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.prepare.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true

      # Cache .m2/repository
      - name: Cache local Maven repository
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-macos-arm-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-macos-arm-${{ hashFiles('**/pom.xml') }}
            cache-maven-

      - name: Install tools via brew
        run: brew bundle
        continue-on-error: true

      - name: Create local staging directory
        run: mkdir -p ~/local-staging

      - name: Build and stage native libraries
        run: |
          echo "$(pwd)"
          ./mvnw -B -Pmac-m1-cross-compile deploy \
            -pl resolver-dns-native-macos,transport-native-unix-common,transport-native-kqueue \
            -DskipTests \
            -DaltDeploymentRepository=local-staging::default::file:///$(pwd)/local-staging
          find $(pwd)/local-staging
          find ~/local-staging

      - name: Upload local staging directory
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-local-staging
          path: ${{ github.workspace }}/local-staging
          if-no-files-found: error
          include-hidden-files: true

  # Stage 5: Merge artifacts and publish to GitHub Packages (and optionally IBM TaaS)
  publish-to-github-packages:
    runs-on: ubuntu-latest
    name: Merge and Publish to GitHub Packages
    needs: [prepare, build-linux-x64, build-linux-aarch64, build-macos-intel, build-macos-arm]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      # Cache .m2/repository
      - name: Cache local Maven repository
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-${{ hashFiles('**/pom.xml') }}
            cache-maven-

      # Configure Maven settings for all registries
      - name: Configure Maven settings
        uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [{
              "id": "github",
              "username": "${{ github.actor }}",
              "password": "${{ secrets.GITHUB_TOKEN }}"
            },
            {
              "id": "central-portal-snapshots",
              "username": "${{ github.actor }}",
              "password": "${{ secrets.GITHUB_TOKEN }}"
            },
            {
              "id": "taas",
              "username": "${{ secrets.TAAS_USERNAME }}",
              "password": "${{ secrets.TAAS_PASSWORD }}"
            }]

      # Setup environment variables
      - name: Prepare environment variables
        run: |
          echo "LOCAL_STAGING_DIR=$HOME/local-staging" >> $GITHUB_ENV

      # Download all staging artifacts
      - name: Download Linux x86_64 staging directory
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-local-staging
          path: ~/linux-x86_64-local-staging

      - name: Download Linux aarch64 staging directory
        uses: actions/download-artifact@v4
        with:
          name: linux-aarch64-local-staging
          path: ~/linux-aarch64-local-staging

      - name: Download macOS x86_64 staging directory
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-local-staging
          path: ~/macos-x86_64-local-staging

      - name: Download macOS aarch64 staging directory
        uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-local-staging
          path: ~/macos-aarch64-local-staging

      # SNAPSHOT deploys to a file:// repo are written with timestamped names
      # (netty-buffer-<v>-20261118.095400-1.jar), which a local ~/.m2 cannot
      # resolve: Maven would fall back to the repos in netty's pom and the
      # netty-all build fails. Rename them to the plain -SNAPSHOT form and drop
      # the generated metadata/checksums. Only runs for a SNAPSHOT build.
      - name: Normalize SNAPSHOT file names in staging directories
        if: needs.prepare.outputs.snapshot == 'true'
        run: |
          for root in ~/linux-x86_64-local-staging ~/linux-aarch64-local-staging \
                      ~/macos-x86_64-local-staging ~/macos-aarch64-local-staging; do
            find "$root" -type d -name '*-SNAPSHOT' | while read -r dir; do
              base="$(basename "$dir")"          # e.g. 4.1.137.2.dse-SNAPSHOT
              ver="${base%-SNAPSHOT}"            # e.g. 4.1.137.2.dse
              rm -f "$dir"/maven-metadata.xml* "$dir"/*.md5 "$dir"/*.sha1
              find "$dir" -maxdepth 1 -type f | while read -r f; do
                name="$(basename "$f")"
                new="$(echo "$name" | sed -E "s/-${ver//./\\.}-[0-9]{8}\.[0-9]{6}-[0-9]+/-${base}/")"
                [ "$new" = "$name" ] || mv -f "$f" "$dir/$new"
              done
            done
          done

      # Install artifacts to local Maven repository
      - name: Copy build artifacts to local maven repository
        run: |
          bash ./.github/scripts/local_staging_install_release.sh \
            ~/.m2/repository \
            ~/linux-x86_64-local-staging \
            ~/linux-aarch64-local-staging \
            ~/macos-x86_64-local-staging \
            ~/macos-aarch64-local-staging

      # Generate netty-all and install to local Maven repository
      - name: Set SNAPSHOT version
        if: needs.prepare.outputs.snapshot == 'true'
        run: ./mvnw -B versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Generate netty-all
        run: |
          ./mvnw -B --file pom.xml -pl all \
            clean install \
            -DskipTests=true

      # Merge all staging repositories
      - name: Merge staging repositories
        run: |
          bash ./.github/scripts/local_staging_install_release.sh \
            ~/local-staging \
            ~/linux-x86_64-local-staging \
            ~/linux-aarch64-local-staging \
            ~/macos-x86_64-local-staging \
            ~/macos-aarch64-local-staging

          # Copy netty-all of this version only. ~/.m2 is cache-restored and
          # may hold netty-all from earlier runs that must not be re-uploaded.
          mkdir -p "$HOME/local-staging/io/netty/netty-all"
          cp -r "$HOME/.m2/repository/io/netty/netty-all/${{ env.VERSION }}" \
                "$HOME/local-staging/io/netty/netty-all/"

      # Deploy to GitHub Packages
      - name: Deploy to GitHub Packages
        run: |
          bash ./.github/scripts/deploy_maven_packages.sh \
            ~/local-staging \
            https://maven.pkg.github.com/${{ github.repository }} \
            github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deploy to IBM TaaS Artifactory (manual runs only, opt-in).
      # The server id "taas" matches the settings.xml entry above.
      - name: Deploy to IBM TaaS Artifactory
        if: github.event_name == 'workflow_dispatch' && inputs.taas_publish != 'none'
        run: |
          bash ./.github/scripts/deploy_maven_packages.sh \
            ~/local-staging \
            ${{ needs.prepare.outputs.taas_url }} \
            taas

      - name: Upload merged staging directory (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merged-local-staging
          path: ~/local-staging
          if-no-files-found: warn
          include-hidden-files: true
